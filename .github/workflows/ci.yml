name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: rerun the pipeline, as a scheduled retraining job would

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with Ray and CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ray,dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Unit tests (incl. Ray backend and LSTM)
        run: pytest -q -rs
      - name: End-to-end pipeline smoke run
        run: python scripts/run_experiments.py --small

  spark-databricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install PySpark, Delta Lake and MLflow
        run: |
          pip install "pyspark==3.5.3" "delta-spark==3.2.1" "mlflow>=2.14,<4" "pyarrow>=14" "pandas>=2.0,<2.3" "numpy<2.1" scikit-learn joblib pytest pyyaml
          pip install -e . --no-deps
      - name: Medallion pipeline on local Spark + Delta, MLflow registry
        run: |
          set +e
          pytest -q -rs --tb=short tests/test_spark_jobs.py 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -E "^E |Error|error:|Exception|FAILED" pytest.log | grep -v "^E *$" | head -25 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $status
      - name: Validate bundle structure
        run: |
          python - <<'PY'
          import yaml, pathlib
          b = yaml.safe_load(open("databricks.yml"))
          for t in b["resources"]["jobs"]["fraud_pipeline"]["tasks"]:
              p = pathlib.Path(t["notebook_task"]["notebook_path"])
              assert p.exists(), p
              assert p.read_text().startswith("# Databricks notebook source"), p
          print("bundle ok:", [t["task_key"] for t in b["resources"]["jobs"]["fraud_pipeline"]["tasks"]])
          PY

  lstm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Train and evaluate the LSTM on the full dataset
        run: python scripts/run_lstm.py --epochs 4
      - uses: actions/upload-artifact@v4
        with:
          name: lstm-metrics
          path: results/lstm_metrics.json
